# Reverse proxy cho máy chủ chạy thật: HTTPS, các đầu đề bảo mật, hạn chế khu quản trị.
#
# Chứng thư đặt tại deploy/nginx/certs/fullchain.pem và privkey.pem (xem docs/04-cai-dat-cau-hinh.md).
# Tệp này chỉ dùng cùng docker-compose.prod.yml; môi trường phát triển vẫn dùng nginx.conf.

upstream lc_api {
    server api:8080;
}

upstream lc_admin {
    server admin:80;
}

upstream lc_opac {
    server opac:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Chặn dò mật khẩu: 10 lượt đăng nhập mỗi phút cho một địa chỉ IP, và 30 lượt/giây cho phần còn lại
# của API. Vùng nhớ 10m đủ cho khoảng 160.000 địa chỉ.
limit_req_zone $binary_remote_addr zone=lc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lc_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Máy chủ cấp chứng thư gọi vào đây để xác minh tên miền; phần còn lại chuyển thẳng sang HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    charset utf-8;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Chỉ TLS 1.2 trở lên: TLS 1.0 và 1.1 đã bị coi là không an toàn và trình duyệt cũng đã bỏ.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Bắt trình duyệt chỉ nói chuyện bằng HTTPS trong hai năm tới, kể cả khi người dùng gõ http://.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 512m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # Đăng nhập cán bộ và đăng nhập bạn đọc: siết riêng, cho phép dồn 5 lượt liền nhau rồi mới xếp hàng.
    location = /api/auth/login {
        limit_req zone=lc_login burst=5 nodelay;
        proxy_pass http://lc_api;
    }

    location = /api/reader/auth/login {
        limit_req zone=lc_login burst=5 nodelay;
        proxy_pass http://lc_api;
    }

    location /api/ {
        limit_req zone=lc_api burst=60 nodelay;
        proxy_pass http://lc_api;
    }

    location /health {
        proxy_pass http://lc_api;
        access_log off;
    }

    # Tài liệu API và bảng điều khiển tác vụ nền: chỉ mở cho dải mạng của thư viện. Sửa dải địa chỉ
    # cho khớp mạng nội bộ trước khi chạy thật.
    location /swagger {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://lc_api;
    }

    location /hangfire {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://lc_api;
    }

    # Giao thức liên thư viện: mở cho mọi nơi, vì đây chính là điểm để thư viện bạn tra vào.
    location /sru {
        proxy_pass http://lc_api;
    }

    location /oai {
        proxy_pass http://lc_api;
    }

    location = /sitemap.xml {
        proxy_pass http://lc_api;
    }

    location = /robots.txt {
        proxy_pass http://lc_api;
    }

    location /admin/ {
        proxy_pass http://lc_admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        proxy_pass http://lc_opac;
    }
}
