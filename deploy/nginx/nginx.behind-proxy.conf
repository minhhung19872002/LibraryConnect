# Reverse proxy của LibraryConnect khi đứng SAU một proxy khác đã lo HTTPS (Caddy, Traefik, Nginx
# của máy chủ dùng chung). Dùng cùng docker-compose.behind-proxy.yml; xem docs/04 mục 5.3.
#
# Khác nginx.prod.conf ở ba chỗ:
#   1. Chỉ nghe HTTP cổng 80 trong mạng Docker, không có chứng thư, không chuyển hướng sang HTTPS.
#   2. Địa chỉ người dùng lấy từ X-Forwarded-For do proxy phía trước ghi, nên giới hạn tốc độ và
#      danh sách cho phép /swagger, /hangfire tính trên IP thật chứ không phải IP của proxy.
#   3. X-Forwarded-Proto truyền tiếp giá trị proxy phía trước gửi (https), để máy chủ sinh đúng
#      địa chỉ tuyệt đối trong sitemap, OAI-PMH, SRU.

# Không dùng khối `upstream` — xem chú thích đầy đủ trong nginx.conf.
resolver 127.0.0.11 valid=10s ipv6=off;

# Máy thu thập (Facebook, Zalo, Google…) không chạy JavaScript, nên ba đường dẫn có nội dung riêng
# được rẽ sang API để nhận index.html đã chèn sẵn thẻ meta và Open Graph (IX.1 — SEO). Người thật
# vẫn nhận thẳng tệp tĩnh từ container opac, không thêm một chặng nào.
map $http_user_agent $lc_crawler {
    default 0;
    "~*(googlebot|bingbot|yandexbot|duckduckbot|baiduspider|applebot|petalbot|ia_archiver|facebookexternalhit|facebot|twitterbot|slackbot|telegrambot|linkedinbot|whatsapp|discordbot|zalo|skypeuripreview|embedly|quora link preview|pinterest|redditbot|vkshare)" 1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Proxy phía trước gửi X-Forwarded-Proto thì tin theo, không thì lấy của kết nối này.
map $http_x_forwarded_proto $lc_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Chỉ tin X-Forwarded-For khi kết nối tới từ mạng nội bộ của Docker (proxy phía trước ở đó).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=lc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lc_api:10m rate=30r/s;
# Vượt hạn mức thì trả 429, không phải 503 mặc định: máy khách phân biệt được "thao tác quá nhanh"
# với "máy chủ hỏng".
limit_req_status 429;

server {
    listen 80;
    server_name _;

    charset utf-8;

    set $lc_api   "api:8080";
    set $lc_admin "admin:80";
    set $lc_opac  "opac:80";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Caddy phía trước cắt TLS và chỉ phục vụ HTTPS, nên khai HSTS ở đây cho cả trang SPA (mục 6.4).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 512m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $lc_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    location = /api/auth/login {
        limit_req zone=lc_login burst=5 nodelay;
        proxy_pass http://$lc_api$request_uri;
    }

    location = /api/reader/auth/login {
        limit_req zone=lc_login burst=5 nodelay;
        proxy_pass http://$lc_api$request_uri;
    }

    location /api/ {
        limit_req zone=lc_api burst=60 nodelay;
        # API cũng tự gửi các tiêu đề này (SecurityHeadersMiddleware) với giá trị chặt hơn cho JSON;
        # giữ một bản của nginx để không có hai dòng X-Frame-Options mâu thuẫn (DENY / SAMEORIGIN).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://$lc_api$request_uri;
    }

    # Trang lỗi 429 dạng JSON theo đúng khuôn ApiResponse: trang tra cứu và ứng dụng di động đọc
    # `message` để hiện cho người dùng; trang HTML mặc định của Nginx thì chúng chỉ hiện "máy chủ lỗi".
    error_page 429 = @qua_tan_suat;

    location @qua_tan_suat {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"success":false,"message":"Bạn thao tác quá nhanh. Vui lòng đợi một phút rồi thử lại.","errors":[]}';
    }

    location /health {
        proxy_pass http://$lc_api$request_uri;
        access_log off;
    }

    # Tài liệu API và bảng điều khiển tác vụ nền: chỉ mở cho dải mạng của thư viện. Với real_ip ở
    # trên, $remote_addr đã là IP thật của người dùng nên proxy phía trước không lọt qua được.
    location /swagger {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://$lc_api$request_uri;
    }

    location /hangfire {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://$lc_api$request_uri;
    }

    location /sru {
        proxy_pass http://$lc_api$request_uri;
    }

    location /oai {
        proxy_pass http://$lc_api$request_uri;
    }

    location = /sitemap.xml {
        proxy_pass http://$lc_api$request_uri;
    }

    location = /robots.txt {
        proxy_pass http://$lc_api$request_uri;
    }

    location ~ ^/admin/(.*)$ {
        # add_header trong location không kế thừa của server, nên nhắc lại đủ bộ. CSP chỉ đặt cho
        # hai SPA: API tự mang CSP riêng (default-src 'none').
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com https://www.google.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        proxy_pass http://$lc_admin/$1$is_args$args;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Ba đường dẫn có nội dung riêng: chi tiết tài liệu, bản tin, trang tĩnh. Máy thu thập đi qua API
    # để lấy thẻ meta đúng; người dùng đi thẳng tới trang tra cứu.
    location ~ "^/(tai-lieu/[0-9a-fA-F-]{36}|tin-tuc/[^/]+|trang/[^/]+)$" {
        set $lc_seo_target $lc_opac;
        if ($lc_crawler) {
            set $lc_seo_target $lc_api;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://$lc_seo_target$request_uri;
    }

    location / {
        # add_header trong location không kế thừa của server, nên nhắc lại đủ bộ. CSP chỉ đặt cho
        # hai SPA: API tự mang CSP riêng (default-src 'none').
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com https://www.google.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        proxy_pass http://$lc_opac$request_uri;
    }
}
