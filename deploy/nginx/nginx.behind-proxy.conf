# Reverse proxy của LibraryConnect khi đứng SAU một proxy khác đã lo HTTPS (Caddy, Traefik, Nginx
# của máy chủ dùng chung). Dùng cùng docker-compose.behind-proxy.yml; xem docs/04 mục 5.3.
#
# Khác nginx.prod.conf ở ba chỗ:
#   1. Chỉ nghe HTTP cổng 80 trong mạng Docker, không có chứng thư, không chuyển hướng sang HTTPS.
#   2. Địa chỉ người dùng lấy từ X-Forwarded-For do proxy phía trước ghi, nên giới hạn tốc độ và
#      danh sách cho phép /swagger, /hangfire tính trên IP thật chứ không phải IP của proxy.
#   3. X-Forwarded-Proto truyền tiếp giá trị proxy phía trước gửi (https), để máy chủ sinh đúng
#      địa chỉ tuyệt đối trong sitemap, OAI-PMH, SRU.

# Không dùng khối `upstream` — xem chú thích đầy đủ trong nginx.conf.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Proxy phía trước gửi X-Forwarded-Proto thì tin theo, không thì lấy của kết nối này.
map $http_x_forwarded_proto $lc_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Chỉ tin X-Forwarded-For khi kết nối tới từ mạng nội bộ của Docker (proxy phía trước ở đó).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=lc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lc_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    charset utf-8;

    set $lc_api   "api:8080";
    set $lc_admin "admin:80";
    set $lc_opac  "opac:80";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 512m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $lc_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    location = /api/auth/login {
        limit_req zone=lc_login burst=5 nodelay;
        proxy_pass http://$lc_api$request_uri;
    }

    location = /api/reader/auth/login {
        limit_req zone=lc_login burst=5 nodelay;
        proxy_pass http://$lc_api$request_uri;
    }

    location /api/ {
        limit_req zone=lc_api burst=60 nodelay;
        proxy_pass http://$lc_api$request_uri;
    }

    location /health {
        proxy_pass http://$lc_api$request_uri;
        access_log off;
    }

    # Tài liệu API và bảng điều khiển tác vụ nền: chỉ mở cho dải mạng của thư viện. Với real_ip ở
    # trên, $remote_addr đã là IP thật của người dùng nên proxy phía trước không lọt qua được.
    location /swagger {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://$lc_api$request_uri;
    }

    location /hangfire {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://$lc_api$request_uri;
    }

    location /sru {
        proxy_pass http://$lc_api$request_uri;
    }

    location /oai {
        proxy_pass http://$lc_api$request_uri;
    }

    location = /sitemap.xml {
        proxy_pass http://$lc_api$request_uri;
    }

    location = /robots.txt {
        proxy_pass http://$lc_api$request_uri;
    }

    location ~ ^/admin/(.*)$ {
        proxy_pass http://$lc_admin/$1$is_args$args;
    }

    location = /admin {
        return 301 /admin/;
    }

    location / {
        proxy_pass http://$lc_opac$request_uri;
    }
}
