# Reverse proxy đứng trước toàn hệ thống LibraryConnect.
#   /        -> OPAC (trang tra cứu công khai)
#   /admin   -> Giao diện quản trị
#   /api     -> Backend API
#   /swagger -> Tài liệu API

upstream lc_api {
    server api:8080;
}

upstream lc_admin {
    server admin:80;
}

upstream lc_opac {
    server opac:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    charset utf-8;

    # Tài liệu số có thể rất lớn; giới hạn đặt rộng và khớp với tham số UPLOAD.MAX_SIZE_MB.
    client_max_body_size 512m;

    # Chuyển tiếp thông tin client thật để backend ghi đúng IP vào nhật ký.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Nhập khẩu biểu ghi và tải tài liệu số có thể chạy lâu.
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        proxy_pass http://lc_api;
    }

    location /health {
        proxy_pass http://lc_api;
        access_log off;
    }

    location /swagger {
        proxy_pass http://lc_api;
    }

    location /hangfire {
        proxy_pass http://lc_api;
    }

    # Giao thức liên thư viện chạy trên HTTP: SRU và OAI-PMH.
    location /sru {
        proxy_pass http://lc_api;
    }

    location /oai {
        proxy_pass http://lc_api;
    }

    # Sơ đồ trang và tệp hướng dẫn máy thu thập do máy chủ sinh động, không phải tệp tĩnh của SPA:
    # danh sách tài liệu thay đổi hằng ngày.
    location = /sitemap.xml {
        proxy_pass http://lc_api;
    }

    location = /robots.txt {
        proxy_pass http://lc_api;
    }

    location /admin/ {
        proxy_pass http://lc_admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Mọi đường dẫn còn lại thuộc trang tra cứu công khai. SPA tự định tuyến bên trong, nên máy chủ
    # trả về cùng một trang cho mọi địa chỉ và để trình duyệt quyết định hiển thị gì.
    location / {
        proxy_pass http://lc_opac;
    }
}
