# Reverse proxy đứng trước toàn hệ thống LibraryConnect.
#   /        -> OPAC (trang tra cứu công khai)
#   /admin   -> Giao diện quản trị
#   /api     -> Backend API
#   /swagger -> Tài liệu API
#
# ---------------------------------------------------------------------------------------------
# Vì sao không dùng khối `upstream`
#
# Khối `upstream` tra tên máy **một lần duy nhất lúc Nginx khởi động** rồi ghim địa chỉ IP ấy mãi.
# Trong Docker, dựng lại một dịch vụ là nó nhận IP mới — mà Nginx thì vẫn gửi tới IP cũ.
#
# Chuyện đã xảy ra thật: sau `docker compose up -d admin opac`, hai container nhận IP mới, container
# quản trị tình cờ chiếm đúng IP mà OPAC vừa nhả ra. Nginx vẫn gửi mọi yêu cầu vào IP cũ ấy, nên
# **trang tra cứu công khai trả về giao diện quản trị** — không có lỗi nào trong nhật ký, mã trả về
# vẫn là 200, chỉ có nội dung là của ứng dụng khác. Nếu không tình cờ mở trang chủ lên nhìn thì
# không ai biết. Trên máy chủ thật, hậu quả nặng hơn nhiều so với ở đây.
#
# Cách chữa: khai máy chủ tên của chính Docker (`127.0.0.11`) rồi đặt tên dịch vụ vào **biến**.
# Có biến trong `proxy_pass` là Nginx tra tên lại theo từng yêu cầu, tôn trọng hạn dùng của bản ghi
# — dựng lại dịch vụ nào thì lượt gọi tiếp theo đã đi đúng địa chỉ mới, không cần khởi động lại
# Nginx.
#
# Đánh đổi: `proxy_pass` có biến thì Nginx **không tự ghép phần đường dẫn còn lại** nữa, nên chỗ
# nào cũng phải viết rõ đường dẫn muốn chuyển tiếp.
# ---------------------------------------------------------------------------------------------

# Máy chủ tên nội bộ của Docker. `valid=10s` để một dịch vụ vừa dựng lại được nhận ra trong mươi
# giây, chứ không phải chờ hết hạn mặc định.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    charset utf-8;

    # Tên dịch vụ đặt vào biến để Nginx tra tên lại theo từng yêu cầu — xem chú thích đầu tệp.
    set $lc_api   "api:8080";
    set $lc_admin "admin:80";
    set $lc_opac  "opac:80";

    # Tài liệu số có thể rất lớn; giới hạn đặt rộng và khớp với tham số UPLOAD.MAX_SIZE_MB.
    client_max_body_size 512m;

    # Chuyển tiếp thông tin client thật để backend ghi đúng IP vào nhật ký.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Tiêu đề bảo mật dùng chung (mục 6.4); location của hai SPA nhắc lại kèm CSP, API bị ẩn bản
    # của nó để không có hai dòng X-Frame-Options mâu thuẫn.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Nhập khẩu biểu ghi và tải tài liệu số có thể chạy lâu.
    proxy_connect_timeout 30s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location /api/ {
        # API cũng tự gửi các tiêu đề này (SecurityHeadersMiddleware) với giá trị chặt hơn cho JSON;
        # giữ một bản của nginx để không có hai dòng X-Frame-Options mâu thuẫn (DENY / SAMEORIGIN).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://$lc_api$request_uri;
    }

    location /health {
        proxy_pass http://$lc_api$request_uri;
        access_log off;
    }

    location /swagger {
        proxy_pass http://$lc_api$request_uri;
    }

    location /hangfire {
        proxy_pass http://$lc_api$request_uri;
    }

    # Giao thức liên thư viện chạy trên HTTP: SRU và OAI-PMH.
    location /sru {
        proxy_pass http://$lc_api$request_uri;
    }

    location /oai {
        proxy_pass http://$lc_api$request_uri;
    }

    # Sơ đồ trang và tệp hướng dẫn máy thu thập do máy chủ sinh động, không phải tệp tĩnh của SPA:
    # danh sách tài liệu thay đổi hằng ngày.
    location = /sitemap.xml {
        proxy_pass http://$lc_api$request_uri;
    }

    location = /robots.txt {
        proxy_pass http://$lc_api$request_uri;
    }

    location ~ ^/admin/(.*)$ {
        # add_header trong location không kế thừa của server, nên nhắc lại đủ bộ. CSP chỉ đặt cho
        # hai SPA: API tự mang CSP riêng (default-src 'none').
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com https://www.google.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        proxy_pass http://$lc_admin/$1$is_args$args;
    }

    location = /admin {
        return 301 /admin/;
    }

    # Mọi đường dẫn còn lại thuộc trang tra cứu công khai. SPA tự định tuyến bên trong, nên máy chủ
    # trả về cùng một trang cho mọi địa chỉ và để trình duyệt quyết định hiển thị gì.
    location / {
        # add_header trong location không kế thừa của server, nên nhắc lại đủ bộ. CSP chỉ đặt cho
        # hai SPA: API tự mang CSP riêng (default-src 'none').
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://drive.google.com https://www.google.com; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        proxy_pass http://$lc_opac$request_uri;
    }
}
