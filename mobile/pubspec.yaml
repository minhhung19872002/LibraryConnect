name: libraryconnect_mobile
description: "LibraryConnect — ứng dụng bạn đọc của phần mềm thư viện số chuẩn kết nối liên thư viện."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  barcode_widget: ^2.0.4
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_local_notifications: ^22.3.0
