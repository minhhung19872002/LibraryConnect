name: libraryconnect_mobile
description: "LibraryConnect — ứng dụng bạn đọc của phần mềm thư viện số chuẩn kết nối liên thư viện."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  barcode_widget: ^2.0.4
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.0
  encrypt: ^5.0.3
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: 10.0.0
  flutter_svg: ^2.3.0
  flutter_widget_from_html_core: ^0.17.3
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.0
  network_info_plus: ^8.2.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  permission_handler: 12.0.0
  screen_brightness: ^2.1.11
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/google_fonts/
  uses-material-design: true
  generate: true

# Màn hình chờ mang thương hiệu (sinh bằng `dart run flutter_native_splash:create`): logo trên nền
# xanh của bảng màu, cả Android 12+ (splash hệ thống) lẫn iOS. Mặc định của `flutter create` là nền
# trắng trống — trông như ứng dụng chưa cài xong.
flutter_native_splash:
  color: "#35523F"
  image: assets/icon/app_icon_foreground.png
  android_12:
    color: "#35523F"
    image: assets/icon/app_icon_foreground.png
    icon_background_color: "#35523F"
  ios: true
  android: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#35523F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
