# Kiểm ứng dụng di động trên iOS bằng máy Mac của GitHub Actions.
#
# Máy phát triển chạy Windows nên không dựng được iOS; đây là chỗ duy nhất trong quy trình có
# macOS + Xcode. Hai việc:
#   1. `ios-build`  — dựng bản phát hành iOS (không ký). Bắt các lỗi cấu trúc: Swift Package Manager,
#      iOS tối thiểu, gói không có bản iOS, mã Swift/ObjC của plugin.
#   2. `ios-simulator` — chạy thật trên iPhone Simulator, gọi vào máy chủ thật, chụp ảnh từng màn
#      hình làm bằng chứng nghiệm thu (E-HSMT mục 2.7). Hai phép thử nối tiếp nhau:
#        - `ios_smoke_test.dart`: các luồng KHÔNG đổi dữ liệu (tra cứu, chi tiết, đăng nhập, thẻ…).
#        - `ios_write_flows_test.dart`: ba luồng GHI — đặt giữ, mượn tự phục vụ, gia hạn — bằng một
#          bạn đọc riêng cho phép thử trên máy chủ thật (số thẻ ở LC_TEST_IOS_CARD bên dưới, mật
#          khẩu và mật khẩu quản trị trong Secrets). Phép thử tự dọn: trả sách, hủy đặt giữ.
#
# Ký và phát hành lên TestFlight cần tài khoản Apple Developer, chưa có.
name: iOS

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2
  LC_API_BASE_URL: https://thuvien.bluestar.com.vn/api
  # Bạn đọc "Bạn đọc kiểm thử iOS" (loại Bạn đọc kiểm thử tự động) trên máy chủ thật — chỉ để phép
  # thử ghi dữ liệu dùng. Mật khẩu: secret LC_TEST_IOS_PASSWORD; quản trị: LC_TEST_ADMIN_PASSWORD.
  LC_TEST_IOS_CARD: TV2026000652

jobs:
  ios-build:
    name: Dựng bản iOS (không ký)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # `connectivity_plus` 7 gọi `NWPath.isUltraConstrained`, chỉ có trong SDK iOS mới nhất; Xcode
      # mặc định của ảnh máy chủ có thể cũ hơn. Chọn bản Xcode cao nhất đang cài và in ra SDK để
      # nhật ký nói rõ bản dựng chạy trên nền nào.
      - name: Chọn Xcode mới nhất
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E "iphoneos|iphonesimulator"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Bản dựng iOS phát hành
        run: >
          flutter build ios --release --no-codesign
          --dart-define=LC_PROFILE=prod
          --dart-define=LC_API_BASE_URL=${{ env.LC_API_BASE_URL }}
          --dart-define=LC_APP_VERSION=1.0.0
          --build-number=${{ github.run_number }}
      - name: Kích thước và ngưỡng iOS của bản dựng
        run: |
          APP=build/ios/iphoneos/Runner.app
          du -sh "$APP"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

  ios-simulator:
    name: Chạy trên iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      # `secrets` không dùng được trong `if` của bước, nên đưa qua env của job.
      LC_TEST_IOS_PASSWORD: ${{ secrets.LC_TEST_IOS_PASSWORD }}
      LC_TEST_ADMIN_PASSWORD: ${{ secrets.LC_TEST_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      # `connectivity_plus` 7 gọi `NWPath.isUltraConstrained`, chỉ có trong SDK iOS mới nhất; Xcode
      # mặc định của ảnh máy chủ có thể cũ hơn. Chọn bản Xcode cao nhất đang cài và in ra SDK để
      # nhật ký nói rõ bản dựng chạy trên nền nào.
      - name: Chọn Xcode mới nhất
        working-directory: .
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E "iphoneos|iphonesimulator"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Khởi động iPhone Simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [ .devices
              | to_entries[]
              | select(.key | test("iOS"))
              | .value[]
              | select(.name | startswith("iPhone"))
            ] | sort_by(.name) | last | .udid')
          test -n "$UDID" && test "$UDID" != "null" || { echo "Không có iPhone Simulator nào"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"
          # Bước xác thực trạm mở khung quét (mobile_scanner). Máy ảo không có camera, nhưng iOS vẫn
          # hỏi quyền; cấp trước để hộp thoại hệ thống không hiện đè lên ứng dụng.
          xcrun simctl privacy "$UDID" grant camera vn.bluestar.libraryconnect || true
      - run: flutter devices

      - name: Chờ máy chủ sẵn sàng
        run: |
          # Cùng một lần đẩy mã cũng chạy workflow Deploy, và nó khởi động lại `lc-api`. Một lượt
          # kiểm đã đăng nhập được (máy chủ ghi 200) rồi đứng im vì trúng đúng lúc ấy. Chờ máy chủ
          # trả lời đã rồi hãy chạy.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "${LC_API_BASE_URL}/public/settings" || echo 000)
            if [ "$code" = "200" ]; then echo "máy chủ sẵn sàng sau $((i * 10)) giây"; exit 0; fi
            echo "t=$((i * 10))s http=$code"
            sleep 10
          done
          echo "::error::Máy chủ không trả 200 sau 10 phút"
          exit 1

      # `flutter drive` để trình điều khiển nhận ảnh chụp; `flutter test` thì các điểm chụp bị bỏ qua.
      # Hạn giờ riêng cho bước này: đã gặp một lượt máy ảo treo im lặng sau khi dựng xong, đốt trọn
      # 60 phút của job rồi mới bị cắt. 25 phút là gấp đôi thời gian chạy thật.
      - name: Kiểm khói trên máy ảo, gọi máy chủ thật
        timeout-minutes: 25
        run: |
          set -o pipefail
          # Ghi ra tệp: khi GitHub cắt bước vì quá giờ, phần đuôi của nhật ký trên màn hình bị mất,
          # mà đúng phần đuôi ấy mới nói được nó kẹt ở đâu. Bước dưới in lại tệp này khi hỏng.
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/ios_smoke_test.dart \
            -d ${{ steps.sim.outputs.udid }} \
            --dart-define=LC_PROFILE=dev \
            --dart-define=LC_API_BASE_URL=${{ env.LC_API_BASE_URL }} 2>&1 | tee drive.log

      # Ba luồng ghi dữ liệu, chạy sau khói (khói đăng xuất xong, phép thử này đăng nhập bạn đọc
      # kiểm thử). Không có secret (pull request từ fork) thì bỏ qua thay vì đổ vì thiếu mật khẩu.
      - name: Đặt giữ, mượn tự phục vụ, gia hạn trên máy ảo, ghi vào máy chủ thật
        if: env.LC_TEST_IOS_PASSWORD != ''
        timeout-minutes: 25
        run: |
          set -o pipefail
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/ios_write_flows_test.dart \
            -d ${{ steps.sim.outputs.udid }} \
            --dart-define=LC_PROFILE=dev \
            --dart-define=LC_API_BASE_URL=${{ env.LC_API_BASE_URL }} \
            --dart-define=LC_TEST_CARD=${{ env.LC_TEST_IOS_CARD }} \
            --dart-define=LC_TEST_PASSWORD="$LC_TEST_IOS_PASSWORD" \
            --dart-define=LC_TEST_ADMIN_PASSWORD="$LC_TEST_ADMIN_PASSWORD" 2>&1 | tee drive-write.log

      - name: Ảnh chụp làm bằng chứng
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: mobile/build/screenshots/
          retention-days: 30
          if-no-files-found: warn

      - name: Đuôi nhật ký flutter drive khi hỏng
        if: failure()
        run: |
          tail -150 drive.log || echo "không có drive.log"
          echo "===== drive-write.log ====="
          tail -150 drive-write.log || echo "không có drive-write.log"

      - name: Nhật ký máy ảo khi hỏng
        if: failure()
        run: |
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show --last 3m --predicate 'process == "Runner"' --style compact | grep -v BackgroundTask | tail -80 || true

      - name: Toàn bộ nhật ký flutter drive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-drive-log
          path: |
            mobile/drive.log
            mobile/drive-write.log
          retention-days: 7
          if-no-files-found: warn
