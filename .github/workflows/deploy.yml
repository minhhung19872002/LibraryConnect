# Đẩy lên main → kiểm thử (ci.yml) → dựng ba ảnh Docker lên GHCR + APK Android → gọi máy chủ kéo
# ảnh mới về. Máy chủ chỉ kéo, không dựng: 4 nhân dùng chung năm hệ thống, không tranh CPU.
#
# Cần hai bí mật trong repo:
#   LC_DEPLOY_SSH_KEY   khóa riêng ed25519, khóa công khai nằm trong authorized_keys của máy chủ với
#                       forced command = deploy/scripts/gh-deploy.sh (khóa này không mở được shell)
#   (GITHUB_TOKEN có sẵn) dùng để đẩy ảnh lên GHCR và để máy chủ kéo ảnh về (truyền qua stdin)
#
# Dựng APK: ký bằng khoá phát hành trong secrets LC_ANDROID_* (cùng khoá với máy phát triển).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

# Dùng chung nhóm với workflow kia: cả hai đều đụng tới máy chủ thật. Đã gặp một lượt kiểm iOS
# đăng nhập được (máy chủ trả 200) rồi đứng im, vì Deploy khởi động lại `lc-api` đúng lúc ấy.
concurrency:
  group: lc-production-server
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/libraryconnect
  LC_API_BASE_URL: https://thuvien.bluestar.com.vn/api

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    name: Image ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
            build_args: ''
          - service: admin
            context: frontend-admin
            build_args: |
              VITE_API_BASE_URL=/api
              VITE_BASE_PATH=/admin/
          - service: opac
            context: frontend-opac
            build_args: |
              VITE_API_BASE_URL=/api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  apk:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      # Khoá ký phát hành: cùng một khoá cho mọi bản dựng (CI lẫn máy phát triển), nếu không mỗi
      # máy ký bằng khoá debug riêng và điện thoại từ chối cài đè ("Ứng dụng chưa được cài đặt").
      # Bản sao khoá nằm ngoài kho mã ở máy phát triển; mất khoá là không cập nhật được app nữa.
      - name: Khoá ký phát hành từ secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Thiếu secret LC_ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/libraryconnect-release.jks
          cat > android/key.properties <<EOF
          storeFile=libraryconnect-release.jks
          storePassword=${{ secrets.LC_ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.LC_ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.LC_ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=LC_PROFILE=prod
          --dart-define=LC_API_BASE_URL=${{ env.LC_API_BASE_URL }}
          --dart-define=LC_APP_VERSION=1.0.0
          --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk LibraryConnect.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LibraryConnect-apk
          path: mobile/LibraryConnect.apk
          retention-days: 30
      # Bản mới nhất luôn ở một địa chỉ cố định để máy chủ (và người dùng) tải về:
      # https://github.com/<owner>/<repo>/releases/download/mobile-latest/LibraryConnect.apk
      - name: Publish to release mobile-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create mobile-latest --repo "$GITHUB_REPOSITORY" --title "Ứng dụng di động — bản mới nhất" \
                 --notes "Tự động dựng từ nhánh main. Ký bằng khoá phát hành LibraryConnect; cài đè được lên bản trước." --latest=false
          gh release upload mobile-latest LibraryConnect.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit mobile-latest --repo "$GITHUB_REPOSITORY" \
            --notes "Dựng từ ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}) lúc $(date -u +%FT%TZ). API: ${LC_API_BASE_URL}. Ký bằng khoá phát hành LibraryConnect; cài đè được lên bản trước."

  deploy:
    name: Máy chủ kéo bản mới
    needs: [images, apk]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Chuẩn bị khóa SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.LC_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '14.225.83.93 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGq2F0GUfqhZAfugc0kF33Mgg72DdiFemy8sWjD/Tfux' >> ~/.ssh/known_hosts
      # Forced command trên máy chủ nhận đúng một đối số (tên bản) và token GHCR qua stdin.
      - name: Gọi gh-deploy.sh trên máy chủ
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes hung@14.225.83.93 "${{ github.sha }}"
